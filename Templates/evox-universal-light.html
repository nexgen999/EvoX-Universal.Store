<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050811"><title>EvoX Universal — Clean Light</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>:root{--bg:#f4f6f8;--panel:#ffffffee;--panel2:#f7f8fa;--line:#dfe3e8;--text:#15181d;--muted:#66707d;--accent:#2563eb;--glow:#2563eb24;--hero:linear-gradient(135deg,#ffffff,#eaf1ff);--chip:#eef3fb;--icon:linear-gradient(135deg,#eaf2ff,#f7f9fc)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:18px;color:var(--text);background:var(--bg);transition:.25s}a{color:inherit}.shell{max-width:1450px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);position:relative;z-index:5}.brand{font-size:19px;font-weight:900;white-space:nowrap}.brand span{color:var(--accent)}.links{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.ql{height:34px;min-width:34px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:12px;font-weight:800;transition:.16s}.ql:hover{border-color:var(--accent);transform:translateY(-1px)}.ql.social{width:34px;padding:0;border-radius:50%;font-size:14px}.bskyMark{font-size:15px}.hero{margin-top:16px;border:1px solid var(--accent);border-radius:24px;overflow:hidden;padding:30px;min-height:220px;position:relative;background:var(--hero);box-shadow:0 20px 60px var(--glow)}.hero:after{content:"";position:absolute;right:-80px;top:-100px;width:380px;height:380px;border-radius:50%;border:1px solid var(--accent);box-shadow:0 0 80px var(--glow);opacity:.5}.heroContent{position:relative;z-index:1;max-width:900px}.hero h1{font-size:clamp(36px,5vw,70px);line-height:.95;margin:0 0 12px;font-weight:950;letter-spacing:-3px}.hero h1 span{color:var(--accent)}.hero p{color:var(--muted);max-width:800px;margin:0 0 18px;font-size:15px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--chip);color:var(--accent);font-size:11px;font-weight:800}.controls{margin-top:16px;padding:11px;border:1px solid var(--line);border-radius:16px;background:var(--panel);display:grid;grid-template-columns:minmax(220px,2fr) 1fr 1fr auto auto;gap:8px}.input,.select,.btn{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 12px;outline:0}.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}.btn{cursor:pointer;font-weight:900}.refresh{background:var(--accent);color:#061018;border-color:transparent}.views{display:flex;gap:5px}.viewBtn{width:42px}.viewBtn.active{background:var(--accent);color:#061018;border-color:transparent}.stats{padding:12px 3px;color:var(--muted);font-size:12px}.results{display:grid;gap:10px}.results.grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}.results.list{grid-template-columns:1fr}.app{border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:14px;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;min-width:0;transition:.18s;cursor:pointer}.grid .app{grid-template-columns:54px minmax(0,1fr);}.grid .appActions{grid-column:1/-1}.app:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 35px var(--glow)}.appIcon{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:var(--icon);border:1px solid var(--line)}.appMain{min-width:0}.appTop{display:flex;align-items:center;gap:8px;justify-content:space-between}.app h3{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.version{font-size:10px;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:4px 7px;white-space:nowrap}.app p{margin:5px 0 8px;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips span{font-size:9px;padding:4px 6px;border-radius:6px;background:var(--chip);color:var(--muted)}.appActions{display:flex;gap:6px;align-items:center}.source{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-decoration:none;color:var(--accent)}.download{height:38px;padding:0 12px;border:0;border-radius:10px;background:var(--accent);color:#061018;font-weight:900;cursor:pointer}.list .app{grid-template-columns:48px minmax(0,2fr) 230px auto;min-height:88px}.list .appIcon{width:48px;height:48px}.list .appActions{grid-column:auto}.list .app p{-webkit-line-clamp:1}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.modal{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{width:min(850px,100%);max-height:90vh;overflow:auto;border:1px solid var(--accent);border-radius:20px;background:var(--panel);box-shadow:0 30px 100px #0009}.dialogHead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.dialogHead h2{margin:0;font-size:20px}.close{border:0;background:none;color:var(--muted);font-size:28px;cursor:pointer}.dialogBody{padding:20px}.modalMeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.modalMeta span{padding:5px 8px;background:var(--chip);border-radius:8px;color:var(--accent);font-size:10px}.desc{color:var(--muted);line-height:1.6}.release{margin:15px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);white-space:pre-wrap;font-size:11px;color:var(--muted);max-height:190px;overflow:auto}.asset{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-top:8px}.asset strong{display:block;word-break:break-all}.asset small{display:block;color:var(--accent);margin-top:5px}.asset code{display:block;color:var(--muted);font-size:9px;word-break:break-all;margin-top:3px}.asset a{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#061018;text-decoration:none;flex:none}footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0}.providers{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:9px}.provider{padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.input{grid-column:1/-1}.refresh{grid-column:1/-1}.views{justify-content:flex-end}.results.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.list .app{grid-template-columns:48px minmax(0,1fr) auto}.list .appActions{grid-column:auto}}
@media(max-width:620px){body{padding:10px}.top{align-items:flex-start}.brand{font-size:16px}.links{max-width:55%}.ql.main{display:none}.hero{padding:22px;min-height:200px}.hero h1{font-size:39px;letter-spacing:-2px}.controls{grid-template-columns:1fr}.input,.refresh{grid-column:auto}.views{justify-content:stretch}.viewBtn{flex:1}.results.grid,.results.list{grid-template-columns:1fr}.app,.list .app{grid-template-columns:48px minmax(0,1fr)}.appActions,.list .appActions{grid-column:1/-1;justify-content:flex-end}.download span{display:inline}.dialogHead h2{font-size:16px}}
@media(max-width:380px){.links{gap:4px}.ql.social{width:30px;height:30px}.hero{padding:18px}.hero h1{font-size:33px}.app{padding:11px}.appIcon{width:46px;height:46px}.app h3{font-size:14px}}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:32px 32px}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#22d3ee08,transparent);animation:sweep 7s linear infinite}@keyframes sweep{from{transform:translateX(-60%)}to{transform:translateX(60%)}}/* Clean Light */
body{background:linear-gradient(180deg,#eef4ff 0,#f7f8fa 42%,#eef0f3 100%);padding:22px}
body:before{opacity:.18;background:radial-gradient(circle at 20% 10%,#2563eb15,transparent 28%),radial-gradient(circle at 90% 30%,#7c3aed12,transparent 25%)}
.top{box-shadow:0 12px 35px #18202d12;border-color:#d9e0ea}
.hero{box-shadow:0 18px 50px #183b7b12;border-color:#b9cdf7}
.hero:after{border-color:#2563eb;opacity:.22}
.hero h1 span{color:#2563eb}
.hero p,.app p,.stats,.desc{color:#64748b}
.controls{box-shadow:0 8px 30px #18202d0b}
.app{box-shadow:0 6px 20px #18202d0a}
.app:hover{box-shadow:0 14px 35px #2563eb1c}

</style></head><body><main class="shell">
<header class="top"><div class="brand" id="brand">EvoX Universal <span>Store</span></div><nav class="links" id="links"></nav></header>
<section class="hero"><div class="heroContent"><h1 id="heroTitle">EvoX Universal <span>Store</span></h1><p id="heroSub">Le hub central pour vos applications.</p><div class="tags" id="heroTags"></div></div></section>
<section class="controls"><input id="search" class="input" placeholder="Rechercher une application, un émulateur, un outil…"><select id="mainCat" class="select"><option value="ALL">Toutes les catégories</option></select><select id="subCat" class="select"><option value="ALL">Toutes les sous-catégories</option></select><button id="refresh" class="btn refresh"><i class="fa-solid fa-rotate-right"></i> Actualiser</button><div class="views"><button class="btn viewBtn" data-view="grid" title="Vue tuiles"><i class="fa-solid fa-grip"></i></button><button class="btn viewBtn" data-view="list" title="Vue liste"><i class="fa-solid fa-list"></i></button></div></section>
<div class="stats" id="stats">Chargement…</div><section id="results" class="results grid"></section>
<footer><div id="footer"></div><div class="providers"><span class="provider"><i class="fa-brands fa-github"></i> GitHub</span><span class="provider"><i class="fa-brands fa-gitlab"></i> GitLab</span><span class="provider"><i class="fa-solid fa-code-fork"></i> Forgejo</span><span class="provider"><i class="fa-solid fa-code-pull-request"></i> Gitea</span><span class="provider"><i class="fa-brands fa-html5"></i> HTML5</span></div></footer>
</main><div class="modal" id="modal"><div class="dialog"><div class="dialogHead"><h2 id="modalTitle"></h2><button class="close" id="close">×</button></div><div class="dialogBody"><div class="modalMeta" id="modalMeta"></div><p class="desc" id="modalDesc"></p><div class="release" id="release"></div><div id="assets"></div></div></div></div><script>const DEFAULT_STORE='json/evox-store.json';
let CONFIG={}, RAW=[], APPS=[], FILTERED=[], VIEW=localStorage.getItem('evox-view')||'grid';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeUrl=s=>{try{const u=new URL(s,location.href);return /^(https?:|mailto:)/i.test(u.protocol)?u.href:'#'}catch{return '#'}};
async function json(url){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function boot(){
 try{CONFIG=await json('config.json')}catch{CONFIG={}}
 applyConfig();
 try{const d=await json(CONFIG.store_data_path||DEFAULT_STORE);RAW=d.store||[];window.updated=d.updated_at||'';buildCategories();filter();}
 catch(e){$('#stats').textContent='Impossible de charger le catalogue : '+e.message}
}
function applyConfig(){
 document.title=CONFIG.site_title||'EvoX Universal Store';
 const h=CONFIG.hero||{};
 $('#brand').innerHTML='<i class="fa-solid fa-cube"></i> '+esc(CONFIG.site_title||'EvoX Universal Store');
 $('#heroTitle').innerHTML=esc(h.title_prefix||'EvoX Universal')+' <span>'+esc(h.title_suffix||'Store')+'</span>';
 $('#heroSub').textContent=h.subtitle||'';
 $('#heroTags').innerHTML=(h.tags||[]).map(t=>'<span class="tag"><i class="fa-solid '+esc(t.icon||'fa-box')+'"></i>'+esc(t.label||'')).join('');
 const q=CONFIG.quick_links||{}, links=[];
 if(q.dev_name&&q.dev_url)links.push(`<a class="ql main" href="${safeUrl(q.dev_url)}" target="_blank"><i class="fa-brands fa-github"></i> ${esc(q.dev_name)}</a>`);
 if(q.repo_url)links.push(`<a class="ql main" href="${safeUrl(q.repo_url)}" target="_blank"><i class="fa-solid fa-code-branch"></i> Repo</a>`);
 const socials={twitter_url:['X','fa-brands fa-x-twitter'],bluesky_url:['Bluesky','bsky'],threads_url:['Threads','fa-brands fa-threads'],facebook_url:['Facebook','fa-brands fa-facebook'],instagram_url:['Instagram','fa-brands fa-instagram'],tiktok_url:['TikTok','fa-brands fa-tiktok'],youtube_url:['YouTube','fa-brands fa-youtube'],twitch_url:['Twitch','fa-brands fa-twitch'],kick_url:['Kick','fa-solid fa-gamepad'],discord_url:['Discord','fa-brands fa-discord'],telegram_url:['Telegram','fa-brands fa-telegram'],whatsapp_url:['WhatsApp','fa-brands fa-whatsapp'],snapchat_url:['Snapchat','fa-brands fa-snapchat'],reddit_url:['Reddit','fa-brands fa-reddit'],linkedin_url:['LinkedIn','fa-brands fa-linkedin'],email:['Email','fa-solid fa-envelope']};
 for(const [k,[label,icon]] of Object.entries(socials))if(q[k]){const u=k==='email'?'mailto:'+q[k]:safeUrl(q[k]);const ico=icon==='bsky'?'<span class="bskyMark">🦋</span>':`<i class="${icon}"></i>`;links.push(`<a class="ql social" title="${label}" href="${u}" target="_blank">${ico}</a>`)}
 $('#links').innerHTML=links.join('');
 $('#footer').textContent=(CONFIG.footer?.text||'EvoX Universal Store')+(window.updated?' · Mise à jour '+new Date(window.updated).toLocaleString('fr-FR'):'');
}
function flat(){APPS=[];for(const c of RAW)for(const a of (c.apps||[]))APPS.push({...a,mainCategory:c.category||'other',subCategory:c.subcategory||'other',category:(c.category||'other')+'/'+(c.subcategory||'other')});return APPS}
function buildCategories(){flat();const main=[...new Set(APPS.map(a=>a.mainCategory))].sort();const m=$('#mainCat');m.innerHTML='<option value="ALL">Toutes les catégories</option>'+main.map(x=>`<option>${esc(x)}</option>`).join('');updateSubs()}
function updateSubs(){const v=$('#mainCat').value;const subs=[...new Set(APPS.filter(a=>v==='ALL'||a.mainCategory===v).map(a=>a.subCategory))].sort();$('#subCat').innerHTML='<option value="ALL">Toutes les sous-catégories</option>'+subs.map(x=>`<option>${esc(x)}</option>`).join('');filter()}
function filter(){const q=$('#search').value.trim().toLowerCase(),m=$('#mainCat').value,s=$('#subCat').value;FILTERED=APPS.filter(a=>{const text=[a.name,a.description,a.version,a.release_notes,a.mainCategory,a.subCategory,a.repo_url].join(' ').toLowerCase();return(!q||text.includes(q))&&(m==='ALL'||a.mainCategory===m)&&(s==='ALL'||a.subCategory===s)});render();}
function source(a){const u=(a.repo_url||'').toLowerCase(),t=a.source_type||'';let icon='fa-globe';if(t==='github'||u.includes('github.com'))icon='fa-brands fa-github';else if(t==='gitlab'||u.includes('gitlab.com'))icon='fa-brands fa-gitlab';else if(t==='forgejo'||u.includes('codeberg')||u.includes('forgejo'))icon='fa-solid fa-code-fork';else if(t==='gitea'||u.includes('gitea'))icon='fa-solid fa-code-pull-request';else if(t==='html5'||u.endsWith('.html')||u.endsWith('.htm'))icon='fa-brands fa-html5';else icon='fa-solid fa-globe';return `<a class="source" href="${safeUrl(a.repo_url||'#')}" target="_blank" title="Ouvrir la source"><i class="${icon}"></i></a>`}
function appIcon(a){const c=(a.mainCategory||'').toLowerCase();return c.includes('emulat')?'🎮':c.includes('media')?'🎬':c.includes('util')?'🛠️':c.includes('develop')?'💻':c.includes('game')?'🕹️':'📦'}
function render(){
 $('#stats').textContent=`${FILTERED.length} application(s) affichée(s) · ${APPS.length} au total · ${new Set(APPS.map(a=>a.mainCategory)).size} catégories`;
 const root=$('#results');root.className=VIEW==='list'?'results list':'results grid';
 root.innerHTML=FILTERED.length?FILTERED.map((a,i)=>card(a,i)).join(''):'<div class="empty">Aucun résultat.</div>';
}
function card(a,i){const assets=a.assets||[];return `<article class="app" onclick="details(${i})">
 <div class="appIcon">${appIcon(a)}</div><div class="appMain"><div class="appTop"><h3>${esc(a.name)}</h3><span class="version">${esc(a.version||'latest')}</span></div>
 <p>${esc(a.description||a.release_notes||'Aucune description')}</p><div class="chips"><span>${esc(a.mainCategory)}</span><span>${esc(a.subCategory)}</span><span>${assets.length} asset(s)</span></div></div>
 <div class="appActions" onclick="event.stopPropagation()">${source(a)}<button class="download" onclick="details(${i})"><i class="fa-solid fa-download"></i><span>Obtenir</span></button></div></article>`}
function details(i){const a=FILTERED[i], assets=a.assets||[];$('#modalTitle').textContent=`${a.name} · ${a.version||'latest'}`;$('#modalMeta').innerHTML=`<span>${esc(a.mainCategory)}</span><span>${esc(a.subCategory)}</span>${source(a)}`;$('#modalDesc').textContent=a.description||'';$('#release').textContent=a.release_notes||'Aucune release note disponible.';$('#assets').innerHTML=assets.length?assets.map(x=>`<div class="asset"><div><strong>${esc(x.filename)}</strong><small>SHA-256</small><code>${esc(x.sha256||'Non calculé')}</code></div><a href="${safeUrl(x.url)}" target="_blank" download><i class="fa-solid fa-download"></i></a></div>`).join(''):'<div class="empty">Aucun fichier disponible.</div>';$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function setView(v){VIEW=v;localStorage.setItem('evox-view',v);document.body.dataset.view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem('evox-theme',t);document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===t))}
document.addEventListener('DOMContentLoaded',()=>{theme(localStorage.getItem('evox-theme')||'neon');setView(VIEW);$('#mainCat').addEventListener('change',updateSubs);$('#subCat').addEventListener('change',filter);$('#search').addEventListener('input',filter);$('#refresh').onclick=boot;$('#close').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>e.key==='Escape'&&closeModal());boot()});
</script><script>document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));</script></body></html>
