<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EvoX Universal Store</title>
<style>
:root{--bg:#111;--paper:#171717;--white:#f7f4ed;--muted:#aaa59c;--orange:#ff5a1f;--line:#30302f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px Georgia,serif}.mag{max-width:1450px;margin:auto;padding:20px}.mast{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:4px solid var(--white);padding:15px 0}.mast h1{font-size:48px;letter-spacing:-2px;margin:0;text-transform:uppercase}.mast h1 span{color:var(--orange)}.mast .date{font:12px ui-monospace;color:var(--muted);text-align:right}.links{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.links a{color:#c7c1b7;text-decoration:none;font:12px ui-monospace}.links a:hover{color:var(--orange)}
.lead{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;padding:28px 0;border-bottom:1px solid var(--line)}.lead h2{font-size:40px;margin:0 0 10px}.lead p{color:var(--muted);font-size:17px;line-height:1.5}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid #494742;border-radius:2px;padding:4px 7px;color:#d4cec3;font:10px ui-monospace;text-transform:uppercase}.edition{background:var(--orange);color:#16100d;padding:24px;display:flex;flex-direction:column;justify-content:end;min-height:180px}.edition b{font-size:42px;line-height:.9}.edition span{margin-top:10px;font:12px ui-monospace}
.controls{display:flex;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}.search{flex:1;background:transparent;border:1px solid #454441;color:#fff;padding:11px;font:14px Georgia}.select,.btn{background:#1b1b1b;border:1px solid #454441;color:#ddd;padding:10px;font:12px ui-monospace}.btn{cursor:pointer}.btn.active{border-color:var(--orange);color:var(--orange)}
#items{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-left:1px solid var(--line)}.app{padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:250px;cursor:pointer;position:relative}.app:hover{background:#1a1a19}.app-icon{font:900 32px Georgia;color:var(--orange);margin-bottom:35px}.app h3{font-size:21px;margin:0 0 7px}.version{color:var(--orange);font:11px ui-monospace}.app p{color:#a7a39c;line-height:1.45;font-size:13px}.meta{display:flex;gap:7px;flex-wrap:wrap;font:10px ui-monospace;color:#77736c}.meta i{font-style:normal;border:1px solid #383735;padding:3px}.app-end{position:absolute;right:18px;bottom:18px;display:flex;gap:8px}.app-end button{background:var(--orange);border:0;color:#180d08;padding:7px 10px;font-weight:bold;cursor:pointer}.source{color:#8b8780}
body[data-view="list"] #items{display:block;border-left:0}.listdummy{}.listdummy{}.listdummy{}
body[data-view="list"] .app{display:grid;grid-template-columns:45px 1fr auto;min-height:0;padding:13px;border-bottom:1px solid var(--line);border-right:0}.body[data-view="list"] .app-icon{}.body[data-view="list"] .app-icon{margin:0}body[data-view="list"] .app-end{position:static}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:10;place-items:center;padding:20px}.modal.open{display:grid}.modal-box{background:#171717;border:2px solid var(--white);width:min(760px,100%);max-height:90vh;overflow:auto;padding:24px;position:relative}.modal-close{position:absolute;right:10px;top:5px;background:none;border:0;color:#fff;font-size:28px}.modal-box>#modalTitle{font-size:28px}.asset{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.asset strong{font-family:ui-monospace;font-size:12px}.asset small{display:block;color:#777;font:10px ui-monospace;word-break:break-all;margin-top:5px}.asset-actions a,.asset-actions button{background:var(--orange);color:#160b06;border:0;padding:7px;text-decoration:none}.asset-actions button{cursor:pointer}.modal-box p{color:#aaa}.modal-box details{color:#bbb;white-space:pre-wrap;line-height:1.5}
@media(max-width:1050px){#items{grid-template-columns:repeat(3,1fr)}.lead{grid-template-columns:1fr}.edition{min-height:130px}}
@media(max-width:760px){.mast{grid-template-columns:1fr}.mast h1{font-size:35px}.controls{flex-wrap:wrap}.search{flex-basis:100%}#items{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.mag{padding:12px}.lead h2{font-size:30px}#items{grid-template-columns:1fr}.app{min-height:220px}.asset{flex-direction:column}}
</style></head><body>

<div class="mag"><header class="mast"><h1><span>EvoX</span> Universal</h1><div class="date">AIO STORE<br>CATALOGUE DIGITAL</div></header>
<nav class="links" data-links></nav><section class="lead"><div><h2 data-title>EvoX Universal Store</h2><p data-subtitle></p><div class="tags" data-tags></div></div><div class="edition"><b data-count>—</b><span>applications disponibles dans l'édition actuelle</span></div></section>
<div class="controls"><input id="search" class="search" placeholder="RECHERCHER..." oninput="doFilter()"><select class="select" data-category onchange="doFilter()"></select><select class="select" data-subcategory onchange="doFilter()"></select><button class="btn active" data-view-btn="grid" onclick="setView('grid')">GRILLE</button><button class="btn" data-view-btn="list" onclick="setView('list')">LISTE</button></div>
<div id="items"></div><footer data-footer style="color:#777;padding:25px 0;font:11px ui-monospace"></footer></div>

<div id="modal" class="modal"><div class="modal-box">
<button class="modal-close" onclick="closeApp()">×</button><div id="modalTitle"></div>
<p id="modalDesc"></p><div id="modalSource"></div><div id="modalAssets"></div>
<details><summary>Release notes</summary><div id="modalNotes"></div></details>
</div></div>
<script>
const CONFIG_URL="config.json";
let cfg={}, store=[], flat=[], filtered=[], selected=null, view=localStorage.getItem("evox-view")||"grid";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const attr=esc;

async function load(){
  try{
    cfg=await (await fetch(CONFIG_URL+"?t="+Date.now())).json();
  }catch(e){ cfg={}; }
  const path=cfg.store_data_path||"json/evox-store.json";
  try{
    const data=await (await fetch(path+"?t="+Date.now())).json();
    store=data.store||[];
    flat=store.flatMap(g=>(g.apps||[]).map(a=>({...a,mainCategory:g.category||"other",subCategory:g.subcategory||"other",categoryPath:[g.category,g.subcategory].filter(Boolean).join(" / ")})));
    applyConfig(data);
    buildFilters();
    render();
  }catch(e){
    document.querySelectorAll("[data-status]").forEach(x=>x.textContent="Impossible de charger le catalogue.");
  }
}
function applyConfig(data){
  document.title=cfg.site_title||"EvoX Universal Store";
  const h=cfg.hero||{};
  const title=(h.title_prefix||"EvoX Universal")+" "+(h.title_suffix||"Store");
  document.querySelectorAll("[data-title]").forEach(x=>x.textContent=title);
  document.querySelectorAll("[data-subtitle]").forEach(x=>x.textContent=h.subtitle||"Catalogue synchronisé automatiquement.");
  const tags=(h.tags||[]).map(t=>`<span class="tag">${esc(t.label)}</span>`).join("");
  document.querySelectorAll("[data-tags]").forEach(x=>x.innerHTML=tags);
  const q=cfg.quick_links||{};
  const links=[
    ["dev_url","◉","Profil développeur"],["repo_url","⌘","Repository"],
    ["twitter_url","𝕏","X"],["bluesky_url","🦋","Bluesky"],["threads_url","@", "Threads"],
    ["facebook_url","f","Facebook"],["instagram_url","◎","Instagram"],["tiktok_url","♪","TikTok"],
    ["youtube_url","▶","YouTube"],["twitch_url","◈","Twitch"],["kick_url","K","Kick"],
    ["discord_url","◌","Discord"],["telegram_url","➤","Telegram"],["whatsapp_url","◔","WhatsApp"],
    ["snapchat_url","◉","Snapchat"],["reddit_url","●","Reddit"],["linkedin_url","in","LinkedIn"],
    ["email","✉","Email"]
  ].filter(([k])=>q[k]);
  document.querySelectorAll("[data-links]").forEach(el=>{
    el.innerHTML=links.map(([k,ic,label])=>{
      const href=k==="email"?"mailto:"+q[k]:q[k];
      return `<a href="${attr(href)}" target="_blank" rel="noopener" title="${attr(label)}"><b>${ic}</b><span>${esc(label)}</span></a>`;
    }).join("");
  });
  const footer=(cfg.footer||{}).text||"EvoX Universal Store";
  document.querySelectorAll("[data-footer]").forEach(x=>x.textContent=footer+(data.updated_at?" · "+new Date(data.updated_at).toLocaleString("fr-FR"):""));
}
function buildFilters(){
  const cats=[...new Set(flat.map(x=>x.mainCategory))].sort();
  const subs=[...new Set(flat.map(x=>x.subCategory))].sort();
  document.querySelectorAll("[data-category]").forEach(s=>{
    s.innerHTML='<option value="">Toutes les catégories</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join("");
  });
  document.querySelectorAll("[data-subcategory]").forEach(s=>{
    s.innerHTML='<option value="">Toutes les sous-catégories</option>'+subs.map(x=>`<option>${esc(x)}</option>`).join("");
  });
}
function doFilter(){
  const q=($("#search")?.value||"").toLowerCase().trim();
  const c=$("[data-category]")?.value||"";
  const s=$("[data-subcategory]")?.value||"";
  filtered=flat.filter(x=>(!q||[x.name,x.description,x.version,x.categoryPath,x.release_notes].join(" ").toLowerCase().includes(q))&&(!c||x.mainCategory===c)&&(!s||x.subCategory===s));
  render();
}
function sourceIcon(a){
  const u=(a.repo_url||"").toLowerCase(), t=(a.source_type||"").toLowerCase();
  if(t==="github"||u.includes("github.com"))return "◉";
  if(t==="gitlab"||u.includes("gitlab.com"))return "◈";
  if(t==="forgejo"||u.includes("codeberg"))return "⑂";
  if(t==="gitea"||u.includes("gitea"))return "◇";
  if(t==="html5")return "▣";
  return "↗";
}
function appIcon(a){
  const n=(a.name||"A").trim();
  return n.replace(/[^a-zA-Z0-9]/g,"").slice(0,2).toUpperCase()||"EX";
}
function platformNames(a){
  const names=(a.assets||[]).map(x=>x.filename||"").map(n=>{
    const s=n.toLowerCase();
    if(s.includes("windows")||s.endsWith(".exe")||s.endsWith(".msi"))return "Windows";
    if(s.includes("linux")||s.endsWith(".appimage"))return "Linux";
    if(s.includes("mac")||s.endsWith(".dmg"))return "macOS";
    if(s.endsWith(".apk"))return "Android";
    if(s.endsWith(".appx"))return "Xbox/UWP";
    if(s.endsWith(".nro"))return "Switch";
    return "Autre";
  });
  return [...new Set(names)];
}
function openApp(a){
  selected=a;
  const modal=$("#modal");
  if(!modal)return;
  $("#modalTitle").textContent=a.name+" · "+(a.version||"");
  $("#modalDesc").textContent=a.description||"";
  $("#modalSource").innerHTML=a.repo_url?`<a href="${attr(a.repo_url)}" target="_blank" rel="noopener">${sourceIcon(a)} Source</a>`:"";
  $("#modalAssets").innerHTML=(a.assets||[]).map((x,i)=>`
    <div class="asset">
      <div><strong>${esc(x.filename||"Fichier")}</strong><small>${x.sha256?"SHA-256 "+esc(x.sha256):"SHA-256 non fourni"}</small></div>
      <div class="asset-actions">${x.sha256?`<button onclick="copyText('${attr(x.sha256)}',this)">Copier SHA</button>`:""}<a href="${attr(x.url||"#")}" target="_blank" rel="noopener">Télécharger</a></div>
    </div>`).join("")||"<p>Aucun fichier disponible.</p>";
  $("#modalNotes").innerHTML=a.release_notes?esc(a.release_notes).replace(/\n/g,"<br>"):"Aucune release note.";
  modal.classList.add("open");
}
function closeApp(){ $("#modal")?.classList.remove("open"); }
function copyText(v,b){navigator.clipboard?.writeText(v);if(b){const t=b.textContent;b.textContent="Copié ✓";setTimeout(()=>b.textContent=t,1200)}}
function setView(v){view=v;localStorage.setItem("evox-view",v);document.body.dataset.view=v;document.querySelectorAll("[data-view-btn]").forEach(b=>b.classList.toggle("active",b.dataset.viewBtn===v));render();}
function render(){
  document.body.dataset.view=view;
  document.querySelectorAll("[data-count]").forEach(x=>x.textContent=`${filtered.length} applications · ${flat.length} au total`);
  const target=$("#items"); if(!target)return;
  target.innerHTML=filtered.map((a,i)=>{
    const plats=platformNames(a);
    return `<article class="app" onclick='openApp(flat[${flat.indexOf(a)}])'>
      <div class="app-icon">${esc(appIcon(a))}</div>
      <div class="app-main">
        <div class="app-head"><h3>${esc(a.name)}</h3><span class="version">${esc(a.version||"latest")}</span></div>
        <p>${esc(a.description||"Aucune description.")}</p>
        <div class="meta"><span>${esc(a.categoryPath)}</span><span>${(a.assets||[]).length} fichiers</span>${plats.slice(0,4).map(p=>`<i>${esc(p)}</i>`).join("")}</div>
      </div>
      <div class="app-end"><span class="source">${sourceIcon(a)}</span><button onclick='event.stopPropagation();openApp(flat[${flat.indexOf(a)}])'>Obtenir</button></div>
    </article>`;
  }).join("")||`<div class="empty">Aucun résultat.</div>`;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeApp()});
window.addEventListener("click",e=>{if(e.target===$("#modal"))closeApp()});

window.addEventListener("DOMContentLoaded",()=>{document.body.dataset.view=view;load();});
</script></body></html>
