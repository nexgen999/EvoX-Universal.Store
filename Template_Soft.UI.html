<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoX Store — Neumorphic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #3b82f6;
            --text: #2d3748;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        .hero-banner {
            background: var(--bg); border-radius: 20px; padding: 25px; margin-bottom: 25px;
            box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
        }
        .controls-bar { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .search-input, .category-select {
            background: var(--bg); border: none; border-radius: 12px; padding: 12px 16px; color: var(--text);
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); outline: none;
        }
        .search-input { flex: 2; min-width: 200px; }
        .category-select { flex: 1; min-width: 140px; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card {
            background: var(--bg); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }
        .btn-action {
            background: var(--bg); border: none; color: var(--accent); font-weight: bold; padding: 10px; border-radius: 10px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); text-align: center; text-decoration: none; margin-top: 15px;
        }
        .btn-action:active { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }
    </style>
</head>
<body>
<div class="container">
    <div class="hero-banner">
        <h2>EvoX Universal Store</h2>
    </div>
    <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher..." onkeyup="filterStore()">
        <select id="mainCategorySelect" class="category-select" onchange="updateSubCategories(); filterStore();"></select>
        <select id="subCategorySelect" class="category-select" onchange="filterStore()"></select>
    </div>
    <div class="grid-container" id="storeGrid"></div>
</div>

<script>
    let rawStoreData = [];
    async function init() {
        try {
            const dataRes = await fetch('json/evox-store.json');
            const data = await dataRes.json();
            rawStoreData = data.store || [];
            populateCategories();
            filterStore();
        } catch(e) { console.error(e); }
    }
    function populateCategories() {
        const main = document.getElementById('mainCategorySelect');
        main.innerHTML = '<option value="ALL">Toutes catégories</option>';
        let cats = new Set();
        rawStoreData.forEach(c => cats.add(c.category));
        cats.forEach(c => main.innerHTML += `<option value="${c}">${c}</option>`);
        updateSubCategories();
    }
    function updateSubCategories() {
        const selected = document.getElementById('mainCategorySelect').value;
        const sub = document.getElementById('subCategorySelect');
        sub.innerHTML = '<option value="ALL">Toutes sous-catégories</option>';
        let subs = new Set();
        rawStoreData.forEach(c => { if(selected === 'ALL' || c.category === selected) subs.add(c.subcategory); });
        subs.forEach(s => sub.innerHTML += `<option value="${s}">${s}</option>`);
    }
    function filterStore() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const main = document.getElementById('mainCategorySelect').value;
        const sub = document.getElementById('subCategorySelect').value;
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';
        rawStoreData.forEach(cat => {
            if (main !== 'ALL' && cat.category !== main) return;
            if (sub !== 'ALL' && cat.subcategory !== sub) return;
            cat.apps.forEach(app => {
                if (q && !app.name.toLowerCase().includes(q) && !(app.description||'').toLowerCase().includes(q)) return;
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <strong>${app.name}</strong> (${app.version || 'v1.0'})
                            <p style="font-size:0.85rem; color:#64748b; margin-top:8px;">${app.description || ''}</p>
                        </div>
                        <a href="${app.repo_url || '#'}" target="_blank" class="btn-action">Obtenir</a>
                    </div>
                `;
            });
        });
    }
    init();
</script>
</body>
</html>
