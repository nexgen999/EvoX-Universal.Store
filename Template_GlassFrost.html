<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoX Store — Glass</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-purple: #8b5cf6;
            --text-main: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main); min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .brand-title { font-size: 1.4rem; font-weight: 800; color: #fff; }

        .hero-banner {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; margin-bottom: 25px;
        }
        .hero-title span { color: var(--accent-purple); }

        .controls-bar { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .search-input, .category-select {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            border-radius: 12px; color: #fff; padding: 12px 16px; outline: none;
        }
        .search-input { flex: 2; min-width: 200px; }
        .category-select { flex: 1; min-width: 140px; }
        .category-select option { background: #1e1b4b; color: #fff; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card {
            background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--accent-purple); transform: translateY(-3px); }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .badge-ver { background: rgba(139, 92, 246, 0.2); color: var(--accent-purple); padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; }
        .btn-action { background: var(--accent-purple); color: #fff; border: none; padding: 10px; border-radius: 10px; width: 100%; text-align: center; text-decoration: none; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="brand-title"><i class="fa-solid fa-gem"></i> EVOX GLASS</div>
    </div>
    <div class="hero-banner">
        <h1 class="hero-title" id="heroTitle">Evox Universal <span>Store</span></h1>
    </div>
    <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher..." onkeyup="filterStore()">
        <select id="mainCategorySelect" class="category-select" onchange="updateSubCategories(); filterStore();"></select>
        <select id="subCategorySelect" class="category-select" onchange="filterStore()"></select>
    </div>
    <div class="grid-container" id="storeGrid"></div>
</div>

<script>
    let rawStoreData = [];
    async function init() {
        try {
            const dataRes = await fetch('json/evox-store.json');
            const data = await dataRes.json();
            rawStoreData = data.store || [];
            populateCategories();
            filterStore();
        } catch(e) { console.error(e); }
    }
    function populateCategories() {
        const main = document.getElementById('mainCategorySelect');
        main.innerHTML = '<option value="ALL">Toutes catégories</option>';
        let cats = new Set();
        rawStoreData.forEach(c => cats.add(c.category));
        cats.forEach(c => main.innerHTML += `<option value="${c}">${c}</option>`);
        updateSubCategories();
    }
    function updateSubCategories() {
        const selected = document.getElementById('mainCategorySelect').value;
        const sub = document.getElementById('subCategorySelect');
        sub.innerHTML = '<option value="ALL">Toutes sous-catégories</option>';
        let subs = new Set();
        rawStoreData.forEach(c => { if(selected === 'ALL' || c.category === selected) subs.add(c.subcategory); });
        subs.forEach(s => sub.innerHTML += `<option value="${s}">${s}</option>`);
    }
    function filterStore() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const main = document.getElementById('mainCategorySelect').value;
        const sub = document.getElementById('subCategorySelect').value;
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';
        rawStoreData.forEach(cat => {
            if (main !== 'ALL' && cat.category !== main) return;
            if (sub !== 'ALL' && cat.subcategory !== sub) return;
            cat.apps.forEach(app => {
                if (q && !app.name.toLowerCase().includes(q) && !(app.description||'').toLowerCase().includes(q)) return;
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <strong style="color:#fff">${app.name}</strong>
                            <span class="badge-ver">${app.version || 'v1.0'}</span>
                        </div>
                        <p style="color:#94a3b8; font-size:0.85rem">${app.description || ''}</p>
                        <a href="${app.repo_url || '#'}" target="_blank" class="btn-action">Télécharger</a>
                    </div>
                `;
            });
        });
    }
    init();
</script>
</body>
</html>
