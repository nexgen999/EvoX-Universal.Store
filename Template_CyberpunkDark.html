<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoX Store — Cyberpunk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-body: #05050b;
            --bg-card: rgba(15, 23, 42, 0.75);
            --accent-pink: #ff007f;
            --accent-cyan: #00f0ff;
            --border-glow: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan));
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 15px;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 127, 0.15), transparent 70%);
        }
        .container { max-width: 1400px; margin: 0 auto; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .brand-title { font-size: 1.3rem; font-weight: 900; background: var(--border-glow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .quick-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .social-btn { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s; }
        .social-btn:hover { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); color: var(--accent-cyan); }

        .hero-banner { background: var(--bg-card); border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); position: relative; overflow: hidden; }
        .hero-title { font-size: 2rem; font-weight: 900; }
        .hero-title span { color: var(--accent-cyan); }
        .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
        .tag { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; }

        .controls-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .search-input, .category-select { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; padding: 10px 14px; outline: none; }
        .search-input { flex: 2; min-width: 220px; }
        .category-select { flex: 1; min-width: 150px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s, box-shadow 0.3s; position: relative; }
        .card:hover { transform: translateY(-4px); border-color: var(--accent-pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .card-title { font-weight: bold; font-size: 1.1rem; color: #fff; }
        .badge-ver { background: rgba(255, 0, 127, 0.15); border: 1px solid var(--accent-pink); color: var(--accent-pink); font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }
        .card-desc { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 15px; flex-grow: 1; }
        .card-footer { display: flex; gap: 8px; }
        .btn-action { width: 100%; padding: 8px; border-radius: 6px; border: none; background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan)); color: #000; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }

        @media (max-width: 768px) {
            .controls-bar { flex-direction: column; }
            .hero-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="brand-title"><i class="fa-solid fa-bolt"></i> EVOX STORE</div>
        <div class="quick-links" id="quickLinksContainer"></div>
    </div>
    <div class="hero-banner">
        <div class="hero-title" id="heroTitle">Evox Universal <span>AIO Store</span></div>
        <div class="hero-subtitle" id="heroSubtitle">Hub de distribution cyberpunk.</div>
        <div class="hero-tags" id="heroTags"></div>
    </div>
    <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher..." onkeyup="filterStore()">
        <select id="mainCategorySelect" class="category-select" onchange="updateSubCategories(); filterStore();"></select>
        <select id="subCategorySelect" class="category-select" onchange="filterStore()"></select>
    </div>
    <div class="grid-container" id="storeGrid"></div>
</div>

<script>
    let rawStoreData = [];
    async function init() {
        try {
            const confRes = await fetch('config.json');
            if (confRes.ok) {
                const conf = await confRes.json();
                document.getElementById('heroTitle').innerHTML = `${conf.hero.title_prefix || ''} <span>${conf.hero.title_suffix || ''}</span>`;
                if (conf.hero.subtitle) document.getElementById('heroSubtitle').innerText = conf.hero.subtitle;
            }
            const dataRes = await fetch('json/evox-store.json');
            const data = await dataRes.json();
            rawStoreData = data.store || [];
            populateCategories();
            filterStore();
        } catch(e) { console.error(e); }
    }
    function populateCategories() {
        const main = document.getElementById('mainCategorySelect');
        main.innerHTML = '<option value="ALL">Toutes catégories</option>';
        let cats = new Set();
        rawStoreData.forEach(c => cats.add(c.category));
        cats.forEach(c => main.innerHTML += `<option value="${c}">${c}</option>`);
        updateSubCategories();
    }
    function updateSubCategories() {
        const selected = document.getElementById('mainCategorySelect').value;
        const sub = document.getElementById('subCategorySelect');
        sub.innerHTML = '<option value="ALL">Toutes sous-catégories</option>';
        let subs = new Set();
        rawStoreData.forEach(c => { if(selected === 'ALL' || c.category === selected) subs.add(c.subcategory); });
        subs.forEach(s => sub.innerHTML += `<option value="${s}">${s}</option>`);
    }
    function filterStore() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const main = document.getElementById('mainCategorySelect').value;
        const sub = document.getElementById('subCategorySelect').value;
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';
        rawStoreData.forEach(cat => {
            if (main !== 'ALL' && cat.category !== main) return;
            if (sub !== 'ALL' && cat.subcategory !== sub) return;
            cat.apps.forEach(app => {
                if (q && !app.name.toLowerCase().includes(q) && !(app.description||'').toLowerCase().includes(q)) return;
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${app.name}</span>
                            <span class="badge-ver">${app.version || 'v1.0'}</span>
                        </div>
                        <div class="card-desc">${app.description || ''}</div>
                        <div class="card-footer">
                            <a href="${app.repo_url || '#'}" target="_blank" class="btn-action">Obtenir</a>
                        </div>
                    </div>
                `;
            });
        });
    }
    init();
</script>
</body>
</html>
