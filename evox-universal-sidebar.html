<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EvoX Universal Store</title>
<style>
:root{--bg:#0a0f18;--panel:#101827;--panel2:#0c1421;--line:#223047;--text:#edf4ff;--muted:#8190a8;--a:#38a8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}a{color:inherit}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#0d1522;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}
.logo{font-size:20px;font-weight:900;padding:8px 10px 28px}.logo b{color:var(--a)}
.navtitle{font-size:10px;text-transform:uppercase;color:#53647e;letter-spacing:1.5px;margin:18px 10px 8px}
[data-links]{display:flex;flex-direction:column;gap:5px}[data-links] a{display:flex;gap:11px;align-items:center;padding:10px;border-radius:9px;text-decoration:none;color:#aab8cd}
[data-links] a:hover{background:#162235;color:#fff}[data-links] a b{width:22px;text-align:center;color:var(--a)}
.sidebar .foot{margin-top:auto;color:#53647e;font-size:11px;line-height:1.5}
.main{padding:28px 34px;min-width:0}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;padding:8px 0 25px;border-bottom:1px solid var(--line)}
h1{font-size:38px;margin:0 0 8px;letter-spacing:-1.5px}h1 span{color:var(--a)}.subtitle{color:var(--muted);max-width:700px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.tag{border:1px solid var(--line);padding:5px 9px;border-radius:20px;color:#9fb0c8;font-size:11px}
.tools{display:flex;gap:8px;align-items:center;margin:20px 0}.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:9px;color:#fff;outline:0}.select,.tool{background:var(--panel);border:1px solid var(--line);color:#cbd6e5;padding:11px;border-radius:9px}.tool{cursor:pointer}.tool.active{background:var(--a);color:#00111f;border-color:var(--a)}
#items{display:grid;gap:9px}.app{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;cursor:pointer;transition:.16s}.app:hover{border-color:#356189;transform:translateX(2px)}
.app-icon{width:48px;height:48px;border-radius:10px;background:linear-gradient(145deg,#1e4e77,#122538);display:grid;place-items:center;font-weight:900;color:#8fd1ff}.app-head{display:flex;gap:10px;align-items:center}.app h3{margin:0;font-size:15px}.app p{margin:5px 0;color:var(--muted);line-height:1.35}.version{font-size:11px;color:var(--a);border:1px solid #254a68;padding:3px 7px;border-radius:12px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#63738b;font-size:11px}.meta i{font-style:normal;border:1px solid #26364c;border-radius:4px;padding:2px 5px}.app-end{display:flex;align-items:center;gap:10px}.source{font-size:18px;color:#8ea0b8}.app-end button,.asset-actions a,.asset-actions button{border:0;background:var(--a);color:#00111f;padding:8px 12px;border-radius:7px;font-weight:800;cursor:pointer;text-decoration:none}
body[data-view="grid"] #items{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}body[data-view="grid"] .app{display:flex;flex-direction:column;align-items:flex-start;height:100%}body[data-view="grid"] .app-main{width:100%}body[data-view="grid"] .app-end{width:100%;justify-content:space-between}body[data-view="grid"] .app-end button{flex:1}
.modal{display:none;position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);z-index:9;place-items:center;padding:20px}.modal.open{display:grid}.modal-box{width:min(720px,100%);max-height:88vh;overflow:auto;background:#101827;border:1px solid #31506e;border-radius:16px;padding:24px;position:relative}.modal-close{position:absolute;right:14px;top:10px;background:none;border:0;color:#aab8cd;font-size:28px;cursor:pointer}.modal-box h2,.modal-box>#modalTitle{font-size:24px;font-weight:900}.modal-box p{color:var(--muted)}#modalSource a{color:var(--a)}.asset{display:flex;justify-content:space-between;gap:15px;padding:12px;margin:8px 0;background:#0b1421;border:1px solid var(--line);border-radius:9px}.asset small{display:block;color:#63738b;font-family:monospace;margin-top:4px;word-break:break-all}.asset-actions{display:flex;gap:6px;align-items:center}.asset-actions button{background:#1a2637;color:#aebdd0;border:1px solid var(--line)}details{margin-top:15px;color:#9cadc3}details div{margin-top:10px;white-space:normal;line-height:1.5}.empty{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.navtitle,.sidebar .foot{display:none}[data-links]{flex-direction:row;overflow:auto}.sidebar .logo{padding:5px 8px 12px}.main{padding:20px 16px}.hero{display:block}h1{font-size:30px}.tools{flex-wrap:wrap}.search{flex-basis:100%}}
@media(max-width:520px){.app{grid-template-columns:42px 1fr}.app-icon{width:42px;height:42px}.app-end{grid-column:2}.app-end button{flex:1}.asset{flex-direction:column}.asset-actions{width:100%}.asset-actions a,.asset-actions button{flex:1;text-align:center}}
</style></head><body>

<div class="layout"><aside class="sidebar"><div class="logo"><b>EvoX</b> Universal</div>
<div class="navtitle">Navigation</div><div data-links></div>
<div class="navtitle">Catalogue</div>
<select class="select" data-category onchange="doFilter()"></select>
<select class="select" data-subcategory onchange="doFilter()" style="margin-top:7px"></select>
<div class="foot" data-footer></div></aside>
<main class="main"><section class="hero"><div><h1><span data-title>EvoX</span></h1><div class="subtitle" data-subtitle></div><div class="tags" data-tags></div></div></section>
<div class="tools"><input id="search" class="search" placeholder="Rechercher une application, un émulateur, une version..." oninput="doFilter()"><button class="tool" data-view-btn="grid" onclick="setView('grid')">▦</button><button class="tool" data-view-btn="list" onclick="setView('list')">☷</button><button class="tool" onclick="load()">↻</button></div>
<div data-count class="subtitle" style="margin-bottom:12px"></div><div id="items"></div></main></div>

<div id="modal" class="modal"><div class="modal-box">
<button class="modal-close" onclick="closeApp()">×</button><div id="modalTitle"></div>
<p id="modalDesc"></p><div id="modalSource"></div><div id="modalAssets"></div>
<details><summary>Release notes</summary><div id="modalNotes"></div></details>
</div></div>
<script>
const CONFIG_URL="config.json";
let cfg={}, store=[], flat=[], filtered=[], selected=null, view=localStorage.getItem("evox-view")||"grid";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const attr=esc;

async function load(){
  try{
    cfg=await (await fetch(CONFIG_URL+"?t="+Date.now())).json();
  }catch(e){ cfg={}; }
  const path=cfg.store_data_path||"json/evox-store.json";
  try{
    const data=await (await fetch(path+"?t="+Date.now())).json();
    store=data.store||[];
    flat=store.flatMap(g=>(g.apps||[]).map(a=>({...a,mainCategory:g.category||"other",subCategory:g.subcategory||"other",categoryPath:[g.category,g.subcategory].filter(Boolean).join(" / ")})));
    applyConfig(data);
    buildFilters();
    render();
  }catch(e){
    document.querySelectorAll("[data-status]").forEach(x=>x.textContent="Impossible de charger le catalogue.");
  }
}
function applyConfig(data){
  document.title=cfg.site_title||"EvoX Universal Store";
  const h=cfg.hero||{};
  const title=(h.title_prefix||"EvoX Universal")+" "+(h.title_suffix||"Store");
  document.querySelectorAll("[data-title]").forEach(x=>x.textContent=title);
  document.querySelectorAll("[data-subtitle]").forEach(x=>x.textContent=h.subtitle||"Catalogue synchronisé automatiquement.");
  const tags=(h.tags||[]).map(t=>`<span class="tag">${esc(t.label)}</span>`).join("");
  document.querySelectorAll("[data-tags]").forEach(x=>x.innerHTML=tags);
  const q=cfg.quick_links||{};
  const links=[
    ["dev_url","◉","Profil développeur"],["repo_url","⌘","Repository"],
    ["twitter_url","𝕏","X"],["bluesky_url","🦋","Bluesky"],["threads_url","@", "Threads"],
    ["facebook_url","f","Facebook"],["instagram_url","◎","Instagram"],["tiktok_url","♪","TikTok"],
    ["youtube_url","▶","YouTube"],["twitch_url","◈","Twitch"],["kick_url","K","Kick"],
    ["discord_url","◌","Discord"],["telegram_url","➤","Telegram"],["whatsapp_url","◔","WhatsApp"],
    ["snapchat_url","◉","Snapchat"],["reddit_url","●","Reddit"],["linkedin_url","in","LinkedIn"],
    ["email","✉","Email"]
  ].filter(([k])=>q[k]);
  document.querySelectorAll("[data-links]").forEach(el=>{
    el.innerHTML=links.map(([k,ic,label])=>{
      const href=k==="email"?"mailto:"+q[k]:q[k];
      return `<a href="${attr(href)}" target="_blank" rel="noopener" title="${attr(label)}"><b>${ic}</b><span>${esc(label)}</span></a>`;
    }).join("");
  });
  const footer=(cfg.footer||{}).text||"EvoX Universal Store";
  document.querySelectorAll("[data-footer]").forEach(x=>x.textContent=footer+(data.updated_at?" · "+new Date(data.updated_at).toLocaleString("fr-FR"):""));
}
function buildFilters(){
  const cats=[...new Set(flat.map(x=>x.mainCategory))].sort();
  const subs=[...new Set(flat.map(x=>x.subCategory))].sort();
  document.querySelectorAll("[data-category]").forEach(s=>{
    s.innerHTML='<option value="">Toutes les catégories</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join("");
  });
  document.querySelectorAll("[data-subcategory]").forEach(s=>{
    s.innerHTML='<option value="">Toutes les sous-catégories</option>'+subs.map(x=>`<option>${esc(x)}</option>`).join("");
  });
}
function doFilter(){
  const q=($("#search")?.value||"").toLowerCase().trim();
  const c=$("[data-category]")?.value||"";
  const s=$("[data-subcategory]")?.value||"";
  filtered=flat.filter(x=>(!q||[x.name,x.description,x.version,x.categoryPath,x.release_notes].join(" ").toLowerCase().includes(q))&&(!c||x.mainCategory===c)&&(!s||x.subCategory===s));
  render();
}
function sourceIcon(a){
  const u=(a.repo_url||"").toLowerCase(), t=(a.source_type||"").toLowerCase();
  if(t==="github"||u.includes("github.com"))return "◉";
  if(t==="gitlab"||u.includes("gitlab.com"))return "◈";
  if(t==="forgejo"||u.includes("codeberg"))return "⑂";
  if(t==="gitea"||u.includes("gitea"))return "◇";
  if(t==="html5")return "▣";
  return "↗";
}
function appIcon(a){
  const n=(a.name||"A").trim();
  return n.replace(/[^a-zA-Z0-9]/g,"").slice(0,2).toUpperCase()||"EX";
}
function platformNames(a){
  const names=(a.assets||[]).map(x=>x.filename||"").map(n=>{
    const s=n.toLowerCase();
    if(s.includes("windows")||s.endsWith(".exe")||s.endsWith(".msi"))return "Windows";
    if(s.includes("linux")||s.endsWith(".appimage"))return "Linux";
    if(s.includes("mac")||s.endsWith(".dmg"))return "macOS";
    if(s.endsWith(".apk"))return "Android";
    if(s.endsWith(".appx"))return "Xbox/UWP";
    if(s.endsWith(".nro"))return "Switch";
    return "Autre";
  });
  return [...new Set(names)];
}
function openApp(a){
  selected=a;
  const modal=$("#modal");
  if(!modal)return;
  $("#modalTitle").textContent=a.name+" · "+(a.version||"");
  $("#modalDesc").textContent=a.description||"";
  $("#modalSource").innerHTML=a.repo_url?`<a href="${attr(a.repo_url)}" target="_blank" rel="noopener">${sourceIcon(a)} Source</a>`:"";
  $("#modalAssets").innerHTML=(a.assets||[]).map((x,i)=>`
    <div class="asset">
      <div><strong>${esc(x.filename||"Fichier")}</strong><small>${x.sha256?"SHA-256 "+esc(x.sha256):"SHA-256 non fourni"}</small></div>
      <div class="asset-actions">${x.sha256?`<button onclick="copyText('${attr(x.sha256)}',this)">Copier SHA</button>`:""}<a href="${attr(x.url||"#")}" target="_blank" rel="noopener">Télécharger</a></div>
    </div>`).join("")||"<p>Aucun fichier disponible.</p>";
  $("#modalNotes").innerHTML=a.release_notes?esc(a.release_notes).replace(/\n/g,"<br>"):"Aucune release note.";
  modal.classList.add("open");
}
function closeApp(){ $("#modal")?.classList.remove("open"); }
function copyText(v,b){navigator.clipboard?.writeText(v);if(b){const t=b.textContent;b.textContent="Copié ✓";setTimeout(()=>b.textContent=t,1200)}}
function setView(v){view=v;localStorage.setItem("evox-view",v);document.body.dataset.view=v;document.querySelectorAll("[data-view-btn]").forEach(b=>b.classList.toggle("active",b.dataset.viewBtn===v));render();}
function render(){
  document.body.dataset.view=view;
  document.querySelectorAll("[data-count]").forEach(x=>x.textContent=`${filtered.length} applications · ${flat.length} au total`);
  const target=$("#items"); if(!target)return;
  target.innerHTML=filtered.map((a,i)=>{
    const plats=platformNames(a);
    return `<article class="app" onclick='openApp(flat[${flat.indexOf(a)}])'>
      <div class="app-icon">${esc(appIcon(a))}</div>
      <div class="app-main">
        <div class="app-head"><h3>${esc(a.name)}</h3><span class="version">${esc(a.version||"latest")}</span></div>
        <p>${esc(a.description||"Aucune description.")}</p>
        <div class="meta"><span>${esc(a.categoryPath)}</span><span>${(a.assets||[]).length} fichiers</span>${plats.slice(0,4).map(p=>`<i>${esc(p)}</i>`).join("")}</div>
      </div>
      <div class="app-end"><span class="source">${sourceIcon(a)}</span><button onclick='event.stopPropagation();openApp(flat[${flat.indexOf(a)}])'>Obtenir</button></div>
    </article>`;
  }).join("")||`<div class="empty">Aucun résultat.</div>`;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeApp()});
window.addEventListener("click",e=>{if(e.target===$("#modal"))closeApp()});

window.addEventListener("DOMContentLoaded",()=>{document.body.dataset.view=view;load();});
</script></body></html>
