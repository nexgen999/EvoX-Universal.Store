<script>
    let rawStoreData = [];
    let appConfig = {};

    // 1. Charge la configuration externe
    async function loadConfig() {
        try {
            const res = await fetch('config.json');
            appConfig = await res.json();
            applyConfig();
        } catch (e) {
            console.warn("Impossible de charger config.json, fallback par défaut.", e);
        }
    }

    // 2. Applique la config au DOM
    function applyConfig() {
        if (!appConfig) return;

        // Titre de l'onglet
        if (appConfig.site_title) document.title = appConfig.site_title;

        // Header & Quick Links
        if (appConfig.quick_links) {
            const q = appConfig.quick_links;
            if (q.dev_name && q.dev_url) {
                const devBtn = document.getElementById('btnDev');
                if (devBtn) {
                    devBtn.href = q.dev_url;
                    devBtn.innerHTML = `<i class="fa-brands fa-github"></i> Dev By ${q.dev_name}`;
                }
            }
            if (q.repo_url) {
                const repoBtn = document.getElementById('btnRepo');
                if (repoBtn) repoBtn.href = q.repo_url;
            }
            if (q.twitter_url) {
                const twBtn = document.getElementById('btnTwitter');
                if (twBtn) twBtn.href = q.twitter_url;
            }
            if (q.bluesky_url) {
                const bsBtn = document.getElementById('btnBluesky');
                if (bsBtn) bsBtn.href = q.bluesky_url;
            }
        }

        // Hero Banner
        if (appConfig.hero) {
            const h = appConfig.hero;
            const heroTitle = document.getElementById('heroTitle');
            if (heroTitle) {
                heroTitle.innerHTML = `${h.title_prefix || ''} <span>${h.title_suffix || ''}</span>`;
            }
            const heroSub = document.getElementById('heroSubtitle');
            if (heroSub && h.subtitle) heroSub.innerText = h.subtitle;

            if (h.tags && Array.isArray(h.tags)) {
                const tagsContainer = document.getElementById('heroTags');
                if (tagsContainer) {
                    tagsContainer.innerHTML = h.tags.map(t => 
                        `<span class="tag"><i class="fa-solid ${t.icon}"></i> ${t.label}</span>`
                    ).join('');
                }
            }
        }
    }

    // 3. Charge les données du store (utilise le chemin du config.json si présent)
    async function loadStore() {
        await loadConfig();
        
        const storePath = appConfig.store_data_path || 'json/evox-store.json';
        try {
            const response = await fetch(storePath);
            const data = await response.json();
            rawStoreData = data.store || [];
            
            const footerBaseText = (appConfig.footer && appConfig.footer.text) 
                ? appConfig.footer.text 
                : "Evox Universal AIO Store";

            if (data.updated_at) {
                const date = new Date(data.updated_at);
                document.getElementById('footerText').innerText = `${footerBaseText} — Dernière mise à jour : ${date.toLocaleString()}`;
            } else {
                document.getElementById('footerText').innerText = footerBaseText;
            }

            populateMainCategories();
            filterStore();
        } catch (error) {
            console.error("Erreur JSON:", error);
            document.getElementById('statsBar').innerText = "Erreur de chargement du catalogue.";
        }
    }

    function getGroupedApps(store) {
        let appsList = [];
        store.forEach(catObj => {
            catObj.apps.forEach(app => {
                appsList.push({
                    name: app.name,
                    description: app.description || app.release_notes || '',
                    version: app.version || 'v1.0',
                    mainCategory: catObj.category,
                    subCategory: catObj.subcategory,
                    category: `${catObj.category}/${catObj.subcategory}`,
                    assets: app.assets || [],
                    sourceType: app.source_type || 'generic',
                    repoUrl: app.repo_url || '#'
                });
            });
        });
        return appsList;
    }

    function getSourceIconHtml(sourceType, repoUrl) {
        let iconClass = "fa-solid fa-globe";
        const urlLower = repoUrl.toLowerCase();

        if (sourceType === 'github' || urlLower.includes('github.com')) {
            iconClass = "fa-brands fa-github";
        } else if (sourceType === 'gitlab' || urlLower.includes('gitlab.com')) {
            iconClass = "fa-brands fa-gitlab";
        } else if (sourceType === 'forgejo' || urlLower.includes('codeberg.org') || urlLower.includes('forgejo')) {
            iconClass = "fa-solid fa-code-fork";
        } else if (sourceType === 'gitea' || urlLower.includes('gitea')) {
            iconClass = "fa-solid fa-code-pull-request";
        } else if (sourceType === 'html5' || urlLower.endsWith('.html') || urlLower.endsWith('.htm')) {
            iconClass = "fa-brands fa-html5";
        }

        return `<a href="${repoUrl}" target="_blank" class="source-link" title="Ouvrir le dépôt (${repoUrl})"><i class="${iconClass}"></i></a>`;
    }

    function populateMainCategories() {
        const select = document.getElementById('mainCategorySelect');
        select.innerHTML = '<option value="ALL">Toutes les catégories</option>';
        let mainCategories = new Set();
        rawStoreData.forEach(c => mainCategories.add(c.category));
        mainCategories.forEach(catName => {
            const opt = document.createElement('option');
            opt.value = catName; opt.innerText = catName;
            select.appendChild(opt);
        });
        updateSubCategories();
    }

    function updateSubCategories() {
        const selectedMain = document.getElementById('mainCategorySelect').value;
        const subSelect = document.getElementById('subCategorySelect');
        subSelect.innerHTML = '<option value="ALL">Toutes les sous-catégories</option>';
        let subCategories = new Set();
        rawStoreData.forEach(c => {
            if (selectedMain === 'ALL' || c.category === selectedMain) {
                subCategories.add(c.subcategory);
            }
        });
        subCategories.forEach(subName => {
            const opt = document.createElement('option');
            opt.value = subName; opt.innerText = subName;
            subSelect.appendChild(opt);
        });
    }

    function renderTable(apps) {
        const tbody = document.getElementById('storeTableBody');
        tbody.innerHTML = '';
        document.getElementById('statsBar').innerText = `${apps.length} application(s) affichée(s)`;

        if (apps.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding:30px;">Aucun résultat.</td></tr>`;
            return;
        }

        apps.forEach((app, index) => {
            const tr = document.createElement('tr');
            const sourceHtml = getSourceIconHtml(app.sourceType, app.repoUrl);

            tr.innerHTML = `
                <td>${sourceHtml}</td>
                <td>
                    <span class="app-name-title">${app.name}</span>
                    <div class="app-desc">${app.description}</div>
                </td>
                <td><span class="badge-ver" title="${app.version}">${app.version}</span></td>
                <td><span class="badge-cat">${app.category}</span></td>
                <td><span style="color: var(--text-muted);">${app.assets.length} fichier(s)</span></td>
                <td>
                    <button class="btn-icon" onclick="openDownloadModal(${index})">
                        <i class="fa-solid fa-download"></i> Obtenir
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });

        window.currentFilteredApps = apps;
    }

    function openDownloadModal(index) {
        const app = window.currentFilteredApps[index];
        document.getElementById('modalAppName').innerText = `${app.name} (${app.version})`;
        
        const listContainer = document.getElementById('modalAssetsList');
        listContainer.innerHTML = '';

        if (app.assets.length === 0) {
            listContainer.innerHTML = '<p style="color: var(--text-muted);">Aucun fichier téléchargeable disponible.</p>';
        } else {
            app.assets.forEach(asset => {
                const card = document.createElement('div');
                card.className = 'asset-card';
                const shaText = asset.sha256 || 'Non calculé';
                card.innerHTML = `
                    <div class="asset-top">
                        <span class="asset-filename"><i class="fa-regular fa-file-code"></i> ${asset.filename}</span>
                        <a href="${asset.url}" class="btn-icon" style="width:auto; padding:5px 12px;" target="_blank">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    </div>
                    <div class="sha-container">
                        <span class="sha-label">SHA256</span>
                        <span class="sha-value" id="sha-${asset.filename}">${shaText}</span>
                        <button class="btn-copy" onclick="copyToClipboard('${shaText}')" title="Copier le SHA256">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        document.getElementById('downloadModal').style.display = 'flex';
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
    }

    function closeModal() {
        document.getElementById('downloadModal').style.display = 'none';
    }

    function filterStore() {
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const selectedMain = document.getElementById('mainCategorySelect').value;
        const selectedSub = document.getElementById('subCategorySelect').value;

        let allApps = getGroupedApps(rawStoreData);

        let filtered = allApps.filter(app => {
            const matchesSearch = app.name.toLowerCase().includes(searchVal) || 
                                  app.description.toLowerCase().includes(searchVal);
            const matchesMain = (selectedMain === 'ALL') || (app.mainCategory === selectedMain);
            const matchesSub = (selectedSub === 'ALL') || (app.subCategory === selectedSub);

            return matchesSearch && matchesMain && matchesSub;
        });

        renderTable(filtered);
    }

    loadStore();
</script>
